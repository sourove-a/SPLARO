# SPLARO D2C Funnel — __HOST__ → localhost:3000 (storefront app, /funnel/drop)
#
# Generated by infrastructure/vps/add-funnel-subdomain.sh. Do not hand-edit on
# the server: the next run regenerates it and your change is gone. Change the
# template, redeploy, re-run the script.
#
# Every drop subdomain gets its own certificate. Hostinger's DNS has no certbot
# plugin, so a wildcard (*.splaro.co) would need a TXT record typed by hand
# every renewal — a per-host HTTP-01 certificate renews itself instead.

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __HOST__;

    ssl_certificate /etc/letsencrypt/live/__HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /_next/static/ {
        alias /var/www/splaro/apps/web/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /images/ {
        alias /var/www/splaro/apps/web/public/images/;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Product photography. The first funnel subdomain shipped without this and
    # every image on a drop was proxied through Node instead of being served
    # off disk by nginx with the shared cache headers.
    location ^~ /uploads/ {
        include /etc/nginx/snippets/splaro-uploads.conf;
    }

    location /fonts/ {
        alias /var/www/splaro/apps/web/public/fonts/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        access_log off;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # The app resolves which drop to serve from this header — it is the
        # whole routing key for the funnel, not a nicety.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
