# Included inside storefront `location ^~ /uploads/` blocks.
# Cache header intentionally omits `always`: missing/error responses must not become immutable.
alias /var/www/splaro-shared/uploads/;
add_header Cache-Control "public, max-age=31536000, immutable";
add_header X-Content-Type-Options nosniff always;
add_header Access-Control-Allow-Origin "https://admin.splaro.co" always;
access_log off;
