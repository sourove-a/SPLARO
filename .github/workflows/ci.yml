name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: splaro_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d splaro_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/splaro_db
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_ENABLED: 'true'
      JWT_SECRET: ci-jwt-secret-min-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters
      ENCRYPTION_KEY: ci-encryption-key-min-32-characters-long
      INTERNAL_HEALTH_SECRET: ci-internal-health-secret-min-16-chars
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_STORE_ID: splaro
      API_PORT: 4000

    steps:
      - uses: actions/checkout@v4

      # A production env file was committed once already (untracked 2026-07-28).
      # These two steps are what stop the next one.
      #
      # --no-git scans the working tree, not history: the old secrets are still in
      # past commits until the filter-repo purge (REMEDIATION-PLAN.md phase 0.3)
      # runs, and a history scan would fail every build until then. Switch to a
      # full history scan once that purge has landed.
      - name: Secret scan
        run: |
          report="$(mktemp)"
          set +e
          docker run --rm -v "$PWD:/repo" -v "$report:/tmp/gitleaks.json" \
            zricethezav/gitleaks:v8.21.2 detect \
            --source /repo --no-git --redact --no-banner \
            --report-format json --report-path /tmp/gitleaks.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            jq '[.[] | {rule: .RuleID, file: .File, line: .StartLine}]' "$report"
          fi
          rm -f "$report"
          exit "$status"

      - name: Block committed env files
        run: |
          tracked=$(git ls-files | grep -E '\.env($|\.)' | grep -v '\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Env file(s) tracked in git:"
            echo "$tracked"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: CSS pipeline
        run: node scripts/verify-css.mjs

      - name: Admin auth contrast gate
        run: node scripts/check-admin-auth-contrast.mjs

      - name: Admin one-token hex gate
        run: node scripts/admin-hex-to-tokens.mjs --check

      - name: Type check
        run: |
          rm -rf apps/web/.next/types apps/admin/.next/types
          pnpm type-check

      - name: Lint web
        run: pnpm --filter @splaro/web lint

      - name: Lint admin
        run: pnpm --filter @splaro/admin lint

      - name: Lint API
        run: pnpm --filter @splaro/api lint

      - name: Database migrate + schema drift check
        run: |
          cd packages/database
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/splaro_db

      - name: Build packages
        run: pnpm build

      - name: Verify build artifacts
        run: |
          test -f packages/types/dist/index.js
          test -f packages/config/dist/index.js
          test -f apps/api/dist/main.js
          test -d apps/web/.next/static/css && ls apps/web/.next/static/css/*.css
          test -d apps/admin/.next/static/css && ls apps/admin/.next/static/css/*.css

      # health/full marks Store Config down when no row exists — Search/catalog
      # routes also expect storeId=splaro. Schema-only db push is not enough.
      - name: Seed CI database
        run: pnpm db:seed
        env:
          ADMIN_PASSWORD: CiAdmin@Splaro2026!
          ADMIN_EMAIL: ci-admin@splaro.co

      - name: API unit tests
        run: pnpm --filter @splaro/api test:unit
        env:
          NODE_ENV: test
          ADMIN_SESSION_SECRET: ci-admin-session-secret-min-32-chars

      - name: API e2e tests
        run: pnpm --filter @splaro/api test:e2e
        env:
          NODE_ENV: test
          ADMIN_SESSION_SECRET: ci-admin-session-secret-min-32-chars
          REDIS_ENABLED: 'false'
          JWT_SECRET: ci-jwt-secret-min-32-characters-long
          ENCRYPTION_KEY: ci-encryption-key-min-32-characters-long
          INTERNAL_HEALTH_SECRET: ci-internal-health-secret-min-16-chars

      - name: Start API and smoke test
        run: node scripts/ci-smoke-api.mjs
        env:
          ADMIN_SESSION_SECRET: ci-admin-session-secret-min-32-chars
